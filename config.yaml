camera:
  adapter: ai_camera_imx500
  width: 1296
  height: 972
  format: RGB888

vision:
  adapter: ai_camera_imx500
  rpk_path: /usr/share/imx500-models/imx500_network_ssd_mobilenetv2_fpnlite_320x320_pp.rpk
  threshold: 0.35

#brain:
  # hailo -> NPU Hailo-10H via hailo-ollama (puerto 8000). ollama -> CPU (puerto 11434).
  #adapter: hailo
  #model: qwen2.5-instruct:1.5b
  #host: http://localhost:8000


brain:
  # hailo -> NPU Hailo-10H via hailo-ollama (puerto 8000). ollama -> CPU (puerto 11434).
  adapter: hailo
  model: qwen3:1.7b
  host: http://localhost:8000
  max_history: 2        # 0 para ilimitado

voice:                        
  adapter: piper             
  model_path: models/bmo.onnx  
  device: "plughw:2,0"    
  sample_rate: 22050

hearing:                    
  adapter: vosk
  model_path: models/vosk-model-small-en-us-0.15
  device: "plughw:2,0"       
  sample_rate: 16000
  wake_word: hello

screen:                       
  enabled: true
  fullscreen: true
  fps: 4

notes:                        
  enabled: true
  path: notes                 

# modo
debug: false
