# =============================================================================
# Configuracion de BMO
# -----------------------------------------------------------------------------
# Este archivo es el CORAZON del desacoplamiento. Cada seccion elige que
# "adapter" concreto se usa para cada capacidad (port). El dia que llegue el
# hardware nuevo (AI Camera IMX500, AI HAT+2 con Hailo-10H), cambias el campo
# `adapter` y nada mas. El codigo del agente ni se entera.
# =============================================================================

camera:
  adapter: ai_camera_imx500   # picamera2 (camara normal) | usb | ai_camera_imx500 (inferencia on-sensor)
  width: 1296
  height: 972
  format: RGB888

vision:
  adapter: ai_camera_imx500   # opencv_haar (solo caras) | ai_camera_imx500 (deteccion on-sensor)
  # --- ai_camera_imx500: la deteccion corre DENTRO del sensor (IMX500) ---
  # OJO: camara y vision deben ser AMBAS ai_camera_imx500 (es un solo dispositivo).
  rpk_path: /usr/share/imx500-models/imx500_network_ssd_mobilenetv2_fpnlite_320x320_pp.rpk
  threshold: 0.35             # confianza minima para contar una deteccion (mas bajo = ve mas cosas)
  models_path: /home/oscar/Desktop/bmo/models
  min_face_size: 80

brain:
  adapter: ollama             # futuro: hailo | cloud
  model: llama3.2:3b          # 3B: mejor tool-calling y menos invencion que gemma3:1b (mas lento)
  host: http://localhost:11434

screen:                       # cara de BMO directo en la pantalla fisica (tkinter)
  enabled: true
  fullscreen: true
  fps: 4
